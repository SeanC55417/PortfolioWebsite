<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information - Sean Chin</title>
    <link rel="stylesheet" href="./style/Home.css" />
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="PortfolioActions.js"></script>
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>Sean Chin</h1>
        <nav class="Nav">
            <button onclick="RedirectHome()" class="NavButton">Home</button>
            <button onclick="RedirectWorkHistory()" class="NavButton">Work History</button>
            <button onclick="RedirectProjects()" class="NavButton">Projects</button>
            <button onclick="RedirectContactInfo()" class="NavButton">Contact Information</button>
        </nav>
    </header>

    <!-- Main Content with controlled width -->
    <div class="container">
        <!-- Contact Information Container -->
        <div class="item" id="ContactInfo">
            <h2>Contact Information</h2>
            <div class="contact-details">
                <p><strong>Email:</strong> SeanChin55417@gmail.com</p>
                <p><strong>Phone Number:</strong> (401)699-1947</p>
                <p><strong>LinkedIn:</strong> <a href="https://linkedin.com/in/sean-chin417">linkedin.com/in/sean-chin417</a></p>
            </div>
            
            <div class="contact-form">
                <h3>Send me a message</h3>
                <div id="form-status"></div>
                <form id="contact-form">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
        
        <!-- Profile Image Container -->
        <div class="profile-container">
            <div class="profile-image">
                <img src="Images/me.png" alt="Sean Chin Profile Photo">
            </div>
        </div>
    </div>

</body>
</html>
